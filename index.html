```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro al Webinar</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-6">

                <!-- Tarjeta del formulario -->
                <div class="card shadow">

                    <div class="card-body p-4">

                        <h1 class="text-center mb-2">
                            Registro al Webinar
                        </h1>

                        <p class="text-center text-muted mb-4">
                            Completa el formulario para participar en nuestro evento.
                        </p>

                        <form>

                            <!-- Nombre completo -->
                            <div class="mb-3">
                                <label for="nombre" class="form-label">
                                    Nombre completo
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="nombre"
                                    name="nombre"
                                    placeholder="Escribe tu nombre completo"
                                    required>
                            </div>


                            <!-- Correo electrónico -->
                            <div class="mb-3">
                                <label for="correo" class="form-label">
                                    Correo electrónico
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="correo"
                                    name="correo"
                                    placeholder="ejemplo@correo.com"
                                    required>
                            </div>


                            <!-- Edad -->
                            <div class="mb-3">
                                <label for="edad" class="form-label">
                                    Edad
                                </label>

                                <input
                                    type="number"
                                    class="form-control"
                                    id="edad"
                                    name="edad"
                                    min="16"
                                    max="99"
                                    placeholder="Ingresa tu edad"
                                    required>
                            </div>


                            <!-- Fecha de nacimiento -->
                            <div class="mb-3">
                                <label for="fecha" class="form-label">
                                    Fecha de nacimiento
                                </label>

                                <input
                                    type="date"
                                    class="form-control"
                                    id="fecha"
                                    name="fecha"
                                    required>
                            </div>


                            <!-- País -->
                            <div class="mb-3">
                                <label for="pais" class="form-label">
                                    País
                                </label>

                                <select
                                    class="form-select"
                                    id="pais"
                                    name="pais"
                                    required>

                                    <option value="">
                                        Selecciona tu país
                                    </option>

                                    <option value="peru">
                                        Perú
                                    </option>

                                    <option value="mexico">
                                        México
                                    </option>

                                    <option value="colombia">
                                        Colombia
                                    </option>

                                    <option value="argentina">
                                        Argentina
                                    </option>

                                    <option value="chile">
                                        Chile
                                    </option>

                                </select>
                            </div>


                            <!-- Tipo de participación -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Tipo de participación
                                </label>

                                <div class="form-check">
                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="participacion"
                                        id="presencial"
                                        value="presencial"
                                        required>

                                    <label
                                        class="form-check-label"
                                        for="presencial">
                                        Presencial
                                    </label>
                                </div>


                                <div class="form-check">
                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="participacion"
                                        id="virtual"
                                        value="virtual">

                                    <label
                                        class="form-check-label"
                                        for="virtual">
                                        Virtual
                                    </label>
                                </div>

                            </div>


                            <!-- Comentarios -->
                            <div class="mb-3">

                                <label
                                    for="comentarios"
                                    class="form-label">

                                    Comentarios

                                </label>

                                <textarea
                                    class="form-control"
                                    id="comentarios"
                                    name="comentarios"
                                    rows="4"
                                    placeholder="Escribe algún comentario (opcional)">
                                </textarea>

                            </div>


                            <!-- Términos y condiciones -->
                            <div class="mb-3 form-check">

                                <input
                                    type="checkbox"
                                    class="form-check-input"
                                    id="terminos"
                                    name="terminos"
                                    required>

                                <label
                                    class="form-check-label"
                                    for="terminos">

                                    Acepto los términos y condiciones

                                </label>

                            </div>


                            <!-- Botón -->
                            <div class="d-grid">

                                <button
                                    type="submit"
                                    class="btn btn-primary">

                                    Registrarme

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>
  
    </div>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
